name = "check_validation"
description = "Release and documentation checks for the validation library"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = ""
tags = ["tool", "release", "check"]

executables = ["check_validation"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
project_tools = "*"

[[pins]]
project_tools = { path = "../../project_tools" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
