name: CI

on:
  push:
    branches: [main]
  pull_request:

# Determinism controls: pin timezone/locale so semantic snapshots stay stable
# (spec §68). Random seeds / hash construction are controlled in-suite.
env:
  TZ: UTC
  LC_ALL: C

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation
        uses: actions/checkout@v7
        with:
          path: validation

      - name: Check out sibling crates (transitive pin closure)
        # check_validation pins project_tools (../../project_tools); the shared
        # action clones the transitive pin closure next to the validation
        # checkout so the release guard can build.
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: validation

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build library
        working-directory: validation
        run: alr --non-interactive build

      - name: Build and run tests
        working-directory: validation
        run: |
          cd tests
          alr --non-interactive build
          ./bin/tests

      - name: Build and run the example
        working-directory: validation
        run: |
          cd examples
          alr --non-interactive build
          ./bin/quickstart

      - name: Release guard (project_tools)
        working-directory: validation
        # The root check_validation/ is the comprehensive release guard
        # (required-surface + text + dependency-boundary audit). Its boundary
        # audit builds and runs the tools/check_validation Ada crate, which
        # replaced the former tools/check_dependencies.sh.
        run: |
          cd check_validation
          alr --non-interactive build
          ./bin/check_validation
