name: CI

on:
  push:
    branches: [main]
  pull_request:

# Determinism controls: pin timezone/locale so semantic snapshots stay stable
# (spec §68). Random seeds / hash construction are controlled in-suite.
env:
  TZ: UTC
  LC_ALL: C

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Alire
        uses: alire-project/setup-alire@v4

      - name: Dependency-boundary audit
        run: ./tools/check_dependencies.sh

      - name: Build library
        run: alr --non-interactive build

      - name: Build and run tests
        run: |
          cd tests
          alr --non-interactive build
          ./bin/tests

      - name: Build and run the example
        run: |
          cd examples
          alr --non-interactive build
          ./bin/quickstart

      - name: Release guard (project_tools)
        run: |
          cd check_validation
          alr --non-interactive build
          ./bin/check_validation
