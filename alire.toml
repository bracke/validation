name = "validation"
description = "Headless, deterministic, strongly typed validation engine for Ada 2022"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/validation"
long-description = "validation is a headless, deterministic, strongly typed validation engine for Ada 2022, answering one question about a subject: is it valid, and if not, why. It validates scalars, records, nested and recursive objects and optional values, and does exactly one job -- it performs no HTTP, database, file, network, scheduler or UI work, does not authenticate or authorize, does not render localized text but returns stable message ids with typed arguments, and never mutates, trims, normalizes or repairs the subject it was given."

tags = ["validation", "headless", "data-quality"]

# Validation is a leaf library: it depends only on the Ada standard library.
# It must never depend on Forms, Tables, Webframework, Database, Identity,
# Authorization, i18n, Humanize, or any other ecosystem project (see docs/ai/
# allowed_dependencies.md). Consumers depend on Validation, never the reverse.
[[depends-on]]
gnat_native = "=15.2.1"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/tests"]

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
